version: '3'

vars:
  WAILS: go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.24
  DEV: '{{.DEV | default "false"}}'
  # The version linked into the binary (internal/version): the release tag
  # (`task build VERSION=v0.1.0`, as the release workflow does), or git's
  # description of the commit after the last tag (v0.1.0-3-g1a2b3c4).
  VERSION:
    sh: git describe --tags --match "v*" --always 2>/dev/null || echo dev
  VERSION_LDFLAGS: '-X github.com/local/mayak/internal/version.Version={{.VERSION}}'

tasks:
  bindings:
    cmds:
      - '{{.WAILS}} generate bindings -ts -d frontend/bindings'

  frontend:install:
    dir: frontend
    cmds:
      - bun install --frozen-lockfile

  frontend:build:
    cmds:
      - task: bindings
      - task: frontend:install
      - cmd: bun --bun run --cwd frontend build

  # The Tesseract OCR runtime ships next to Mayak.exe. The pinned UB Mannheim
  # build is downloaded once (checksum-verified) and unpacked with 7-Zip.
  # build/tessdata holds MAYAK' own models (tools/ocrtrain/README.md).
  tesseract:bundle:
    summary: Build the bundled Tesseract runtime in build/bin/tesseract
    platforms: [windows]
    sources:
      - build/tessdata/*.traineddata
      - tools/tessbundle/*.go
    generates:
      - build/bin/tesseract/tesseract.exe
    cmds:
      - go run ./tools/tessbundle -fetch -out build/bin/tesseract -lang eng,jpn -tessdata build/tessdata/eft.traineddata,build/tessdata/eftjpn.traineddata

  # The licenses of everything in the binary and beside it, for the people
  # who get Mayak.exe (tools/notices).
  notices:
    cmds:
      - go run ./tools/notices -out build/bin/THIRD_PARTY_NOTICES.txt

  build:
    summary: Build the Wails v3 application without launching it
    cmds:
      - task: frontend:build
      - task: tesseract:bundle
      - task: notices
      - task: 'build:{{OS}}'

  # Windows resources (icon, manifest, version info) that go build links in.
  syso:
    platforms: [windows]
    sources:
      - build/windows/*
    generates:
      - mayak_windows_{{ARCH}}.syso
    cmds:
      - '{{.WAILS}} generate syso -arch {{ARCH}} -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out mayak_windows_{{ARCH}}.syso'

  build:windows:
    cmds:
      - task: syso
      - 'go build -p 2 -buildvcs=false {{if ne .DEV "true"}}-tags production{{end}} -ldflags="{{if ne .DEV "true"}}-s -w -H windowsgui {{end}}{{.VERSION_LDFLAGS}}" -o build/bin/Mayak.exe .'

  build:darwin:
    cmds:
      - 'go build -p 2 -buildvcs=false {{if ne .DEV "true"}}-tags production{{end}} -ldflags="{{if ne .DEV "true"}}-s -w {{end}}{{.VERSION_LDFLAGS}}" -o build/bin/Mayak .'

  build:linux:
    cmds:
      - 'go build -p 2 -buildvcs=false {{if ne .DEV "true"}}-tags production{{end}} -ldflags="{{if ne .DEV "true"}}-s -w {{end}}{{.VERSION_LDFLAGS}}" -o build/bin/Mayak .'

  # The archive a GitHub release carries for this OS (build/dist), named as
  # the app's updater expects (internal/update), with its SHA-256 beside it.
  # The release workflow (.github/workflows/release.yml) runs this on every
  # platform after `task build` and publishes the results.
  release:archive:
    summary: Pack build/bin into the release archive for this OS and CPU
    cmds:
      - 'go run ./tools/release -bin build/bin -out build/dist -arch {{.TARGET_ARCH | default ARCH}}'

  # The docs site (docs/): mdBook builds it into build/docs-site, wrangler
  # publishes it to Cloudflare Pages (wrangler.jsonc). Sign in once with
  # `wrangler login` and create the project with
  # `wrangler pages project create mayak-docs`.
  docs:build:
    cmds:
      - mdbook build docs

  docs:serve:
    summary: Preview the docs site with live reload
    cmds:
      - mdbook serve docs

  docs:deploy:
    summary: Build the docs site and publish it to Cloudflare Pages
    cmds:
      - task: docs:build
      - wrangler pages deploy

  # The landing page (site/public, plain HTML): a separate Cloudflare Pages
  # project, "mayak" (site/wrangler.jsonc).
  site:serve:
    summary: Preview the landing page locally
    dir: site
    cmds:
      - wrangler pages dev public

  site:deploy:
    summary: Publish the landing page to Cloudflare Pages
    dir: site
    cmds:
      - wrangler pages deploy

  dev:
    summary: Run with hot reload (Go changes rebuild and restart the app; WebUI changes reload via Vite)
    cmds:
      # A fresh checkout or worktree has no node_modules yet.
      - task: frontend:install
      - '{{.WAILS}} dev -config ./build/config.yml -port 9245'

  build:dev:
    summary: Development build used by `dev` (no production tag, so assets come from the Vite dev server)
    cmds:
      - task: bindings
      - task: tesseract:bundle
      - task: syso
      - 'go build -p 2 -buildvcs=false -ldflags="{{.VERSION_LDFLAGS}}" -o build/bin/Mayak-dev{{exeExt}} .'

  check:offline:
    summary: Compile Go and run isolated browser state tests without opening the application
    cmds:
      - go test -p 2 -run '^$' ./...
      - go test -p 2 -run '^TestBrowser' ./internal/app
      - bun test ./frontend/src/browser/state.test.js ./frontend/src/browser/item.test.js

  run:
    summary: Launch the application (only when explicitly requested)
    cmds:
      - cmd: ./build/bin/Mayak.exe
        platforms: [windows]
      - cmd: ./build/bin/Mayak
        platforms: [darwin, linux]
