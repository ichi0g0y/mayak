[book]
title = "MAYAK 仕様書"
authors = ["MAYAK"]
language = "ja"
# The chapters live directly in docs/ (SUMMARY.md lists them).
src = "."

[build]
# Outside docs/, so the built site is not picked up as a source.
build-dir = "../build/docs-site"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/ichi0g0y/mayak"
