# Builds MAYAK from the development branch every night and publishes it as
# the rolling "nightly" pre-release (tag `nightly`, replaced each time). The
# app's updater takes it on the nightly channel when it is newer than the
# latest release (internal/update: LatestFor). Its version is `git describe`
# after the last release tag (0.1.17-16-ge057eae), which sorts after that
# release and before the next one. The build steps follow release.yml; keep
# the two in step.
#
# Scheduled runs start only from the default branch's copy of this file.
name: Nightly

on:
  schedule:
    # 03:00 in Japan.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to build
        default: rename-mayak
      force:
        description: Build even when nothing changed since the last nightly
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  NIGHTLY_REF: ${{ inputs.ref || 'rename-mayak' }}

jobs:
  check:
    name: Anything new?
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NIGHTLY_REF }}
          fetch-depth: 0

      - id: check
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          sha=$(git rev-parse HEAD)
          version=$(git describe --tags --match 'v*')
          release=$(git describe --tags --match 'v*' --abbrev=0)
          last=$(git ls-remote origin refs/tags/nightly | cut -f1)
          build=true
          # The same commit as the last nightly: nothing to publish.
          if [ "$last" = "$sha" ] && [ "$FORCE" != "true" ]; then build=false; fi
          # The head is a release itself: the release is what to install.
          if [ "$version" = "$release" ]; then build=false; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "nightly $version from $sha (last nightly $last): build=$build"

  build:
    name: Build ${{ matrix.target }}
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
          - os: macos-latest
            target: darwin-arm64
          - os: macos-latest
            target: darwin-amd64
            goarch: amd64
          - os: ubuntu-latest
            target: linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          # The version linked into the binary comes from `git describe`.
          fetch-depth: 0

      - name: Install Go, bun and Task (mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: go bun task

      - name: Install GTK and WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build
        env:
          GOARCH: ${{ matrix.goarch || '' }}
          CGO_ENABLED: ${{ matrix.goarch && '1' || '' }}
        run: task build VERSION=v${{ needs.check.outputs.version }}

      - name: Installer
        if: runner.os == 'Windows'
        run: task installer VERSION=v${{ needs.check.outputs.version }}

      - name: Archive
        run: task release:archive VERSION=v${{ needs.check.outputs.version }} ${{ matrix.goarch && format('TARGET_ARCH={0}', matrix.goarch) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: build/dist/*
          if-no-files-found: error
          # Only the publish job reads it; the release keeps the files.
          retention-days: 1

  publish:
    name: Publish nightly
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Join checksums
        run: |
          cd dist
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          rm *.sha256
          ls -l
          cat SHA256SUMS.txt

      # The tag moves to the new build: the old release and its tag go
      # first, so no archive of an older version stays behind.
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.check.outputs.sha }}
          VERSION: ${{ needs.check.outputs.version }}
          RELEASE: ${{ needs.check.outputs.release }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          notes="Development build of ${NIGHTLY_REF} at ${SHA}. It may still have bugs.
          Changes since ${RELEASE}: https://github.com/${GH_REPO}/compare/${RELEASE}...${SHA}

          開発中のビルドです（${NIGHTLY_REF} の ${SHA}）。不具合が残っていることがあります。"
          gh release create nightly dist/* --prerelease --target "$SHA" --title "MAYAK nightly $VERSION" --notes "$notes"
