# Builds MAYAK for every platform when a version tag (v1.2.3) is pushed and
# publishes the archives, with SHA256SUMS.txt, as a GitHub release. The app
# updates itself from these releases (internal/update): the archive names
# and the checksums file are what it looks for.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
          - os: macos-latest
            target: darwin-arm64
          - os: macos-latest
            target: darwin-amd64
            goarch: amd64
          - os: ubuntu-latest
            target: linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The version linked into the binary comes from `git describe`.
          fetch-depth: 0

      - name: Install Go, bun and Task (mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: go bun task

      - name: Install GTK and WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build
        env:
          GOARCH: ${{ matrix.goarch || '' }}
        run: task build ${{ startsWith(github.ref, 'refs/tags/') && format('VERSION={0}', github.ref_name) || '' }}

      - name: Archive
        run: task release:archive ${{ matrix.goarch && format('TARGET_ARCH={0}', matrix.goarch) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: build/dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Join checksums
        run: |
          cd dist
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          rm *.sha256
          ls -l
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: MAYAK ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
